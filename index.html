<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Haider</title>
<style>
body{background:#fff0f3;text-align:center;font-family:sans-serif;padding:40px;color:#4a1028}
#bar{width:80%;height:10px;background:#ffc2d1;border-radius:10px;margin:30px auto}
#fill{height:100%;width:0%;background:#e11d48;border-radius:10px}
.btn{background:#e11d48;color:white;border:none;padding:14px 30px;border-radius:30px;font-size:18px;margin-top:20px}
.card{background:white;padding:25px;border-radius:20px;margin-top:20px}
</style>
</head>
<body>
<div id="loader">
<div style="font-size:50px">❤️</div>
<h1>Preparing something special for you</h1>
<div id="bar"><div id="fill"></div></div>
<div id="per">0%</div>
</div>
<div id="main" style="display:none">
<div style="font-size:50px">🎂</div>
<h1>Happy Birthday Haider!</h1>
<div class="card">
<p>Aaj ka din Aap ke naam hai<br><br>
Allah Aap ko hamesha khush rakhe. Aap ki har dua qubool ho.<br><br>
Aap ki muskurahat sab se pyari hai.<br><br>
<b>- Mimi ❤️</b></p>
</div>
</div>
<script>
let p=0;
setInterval(()=>{
p+=2;if(p>100)p=100;
document.getElementById('fill').style.width=p+'%';
document.getElementById('per').innerText=p+'%';
if(p>=100){
document.getElementById('loader').style.display='none';
document.getElementById('main').style.display='block';
}
},30);
</script>
</body>
</html>
